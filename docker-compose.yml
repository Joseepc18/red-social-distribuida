services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devpassword}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - social
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" 'RETURN 1;' > /dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    build:
      context: ./infra/minio
      target: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-redsocial}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-redsocial-minio-local}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - social
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio-init:
    build:
      context: ./infra/minio
      target: mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-redsocial}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-redsocial-minio-local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set storage http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing storage/media
        mc anonymous set-json /etc/minio/media-readonly.json storage/media
        mc anonymous get storage/media
    networks:
      - social

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Override the image's /data volume with memory-only storage.
    tmpfs:
      - /data
    networks:
      - social
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = PONG ]"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Generates the JWT key pair and the VAPID keys once, into a shared volume.
  # Later runs keep them, so issued tokens and push subscriptions stay valid.
  keys-init:
    image: alpine:3.20
    restart: "no"
    entrypoint: ["sh", "-ec"]
    command:
      - |
        apk add --no-cache openssl > /dev/null
        cd /keys
        if [ ! -f privateKey.pem ]; then
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out privateKey.pem
          openssl pkey -in privateKey.pem -pubout -out publicKey.pem
        fi
        if [ ! -f vapid-private.txt ]; then
          openssl ecparam -name prime256v1 -genkey -noout -out vapid.pem
          openssl ec -in vapid.pem -outform DER 2> /dev/null | tail -c +8 | head -c 32 | base64 -w0 | tr '+/' '-_' | tr -d '=' > vapid-private.txt
          openssl ec -in vapid.pem -pubout -outform DER 2> /dev/null | tail -c 65 | base64 -w0 | tr '+/' '-_' | tr -d '=' > vapid-public.txt
          rm vapid.pem
        fi
        chmod 644 /keys/*
    volumes:
      - app_keys:/keys
    networks:
      - social

  backend-1:
    image: &backend-image red-social-distribuida-backend:local
    build: &backend-build
      context: ./backend
    restart: unless-stopped
    environment: &backend-environment
      INSTANCE_ID: backend-1
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-devpassword}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-redsocial}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-redsocial-minio-local}
      MINIO_BUCKET: media
      MEDIA_PUBLIC_URL: ${MEDIA_PUBLIC_URL:-/media/}
      JWT_PUBLIC_KEY_LOCATION: file:/keys/publicKey.pem
      JWT_PRIVATE_KEY_LOCATION: file:/keys/privateKey.pem
      # Optional overrides: when empty, the entrypoint uses the keys generated by keys-init.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    entrypoint: &backend-entrypoint
      - sh
      - -c
      - |
        [ -n "$$VAPID_PUBLIC_KEY" ] || export VAPID_PUBLIC_KEY="$$(cat /keys/vapid-public.txt)"
        [ -n "$$VAPID_PRIVATE_KEY" ] || export VAPID_PRIVATE_KEY="$$(cat /keys/vapid-private.txt)"
        exec java $$JAVA_OPTS -jar /deployments/quarkus-run.jar
    volumes: &backend-volumes
      - app_keys:/keys:ro
    depends_on: &backend-dependencies
      keys-init:
        condition: service_completed_successfully
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks: &backend-networks
      - social
    healthcheck: &backend-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/q/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend-2:
    image: *backend-image
    build: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-environment
      INSTANCE_ID: backend-2
    entrypoint: *backend-entrypoint
    volumes: *backend-volumes
    depends_on: *backend-dependencies
    networks: *backend-networks
    healthcheck: *backend-healthcheck

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend-1:
        condition: service_healthy
      backend-2:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - social
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:2026.9.3
    profiles:
      - demo
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://frontend:80"]
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - social

networks:
  social:
    driver: bridge

volumes:
  neo4j_data:
  minio_data:
  app_keys:
