server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Infrastructure supplies the upstreams in issue #12.
    location /api/ { return 503; }
    location /ws/ { return 503; }
    location /media/ { return 503; }
}
