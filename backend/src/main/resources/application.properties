# ---------------------------------------------------------------------------
# Every value that changes between environments comes from an environment
# variable with a local default (${ENV_VAR:default}).
# Profiles: %dev = ./mvnw quarkus:dev, %test = tests, %prod = packaged app (Docker).
# ---------------------------------------------------------------------------

# Instance identity (shown in GET /api/info and in every log line)
app.instance-id=${INSTANCE_ID:local}
quarkus.log.console.format=%d{HH:mm:ss} %-5p [${app.instance-id}] [%c{2.}] (%t) %s%e%n

# REST: every JAX-RS resource lives under /api
quarkus.rest.path=/api

# ---------------------------------------------------------------------------
# JWT
# Dev and test: no key is configured, so smallrye-jwt generates an RSA key pair
# at startup (verification + signing work with no manual steps).
# Prod: key files are mounted into the container; paths come from env vars.
# No private key is ever committed.
# ---------------------------------------------------------------------------
mp.jwt.verify.issuer=${JWT_ISSUER:red-social}
smallrye.jwt.new-token.issuer=${mp.jwt.verify.issuer}
smallrye.jwt.new-token.lifespan=${JWT_LIFESPAN_SECONDS:86400}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:file:/keys/publicKey.pem}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:file:/keys/privateKey.pem}

# ---------------------------------------------------------------------------
# Neo4j
# Dev and prod connect to the configured server. Tests leave the URI unset so
# Quarkus Dev Services starts a throwaway Neo4j container.
# ---------------------------------------------------------------------------
%dev,prod.quarkus.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
%dev,prod.quarkus.neo4j.authentication.username=${NEO4J_USER:neo4j}
%dev,prod.quarkus.neo4j.authentication.password=${NEO4J_PASSWORD:devpassword}
quarkus.neo4j.devservices.image-name=neo4j:5-community

# ---------------------------------------------------------------------------
# Redis (pub/sub broker for chat between instances)
# Same approach as Neo4j: tests get a throwaway Redis from Dev Services.
# ---------------------------------------------------------------------------
%dev,prod.quarkus.redis.hosts=redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}
quarkus.redis.devservices.image-name=redis:7-alpine

# Chat: protocol ping frames, not application messages. Bound incoming JSON size.
quarkus.websockets-next.server.auto-ping-interval=30s
quarkus.websockets-next.server.max-message-size=16384
quarkus.websockets-next.server.max-frame-size=16384

# ---------------------------------------------------------------------------
# Object storage (MinIO through the S3 API)
# ---------------------------------------------------------------------------
quarkus.s3.endpoint-override=${MINIO_ENDPOINT:http://localhost:9000}
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:minioadmin}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minioadmin}
quarkus.s3.devservices.enabled=false
app.media.bucket=${MINIO_BUCKET:media}
app.media.public-url=${MEDIA_PUBLIC_URL:/media/}

# A 5 MiB image plus multipart overhead and text. File validation stays in ImageValidator.
quarkus.http.limits.max-body-size=6M
quarkus.http.limits.max-form-attribute-size=24K
quarkus.http.body.delete-uploaded-files-on-end=true

# ---------------------------------------------------------------------------
# Web Push (VAPID)
# Keys come from the environment; without them the public key endpoint answers
# 503 and no notification is sent. BC registers BouncyCastle for web-push.
# ---------------------------------------------------------------------------
app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:}
%test.app.push.vapid.public-key=test-vapid-public-key
quarkus.security.security-providers=BC

# ---------------------------------------------------------------------------
# OpenAPI + Swagger UI (always included, not only in dev mode).
# Both live under /api so they are reachable through the Nginx /api proxy.
# ---------------------------------------------------------------------------
quarkus.smallrye-openapi.path=/api/openapi
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.info-title=Red Social Distribuida API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API REST de la red social distribuida. Usa "Authorize" con el JWT obtenido en /api/auth/login.
quarkus.swagger-ui.path=/api/docs
quarkus.swagger-ui.always-include=true

# Health stays at the default /q/health (includes the Neo4j check)
