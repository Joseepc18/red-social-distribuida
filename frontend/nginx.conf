map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Apply to every route: query strings and Referer can expose a WebSocket JWT.
log_format without_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

map $status $ws_failed {
    default 0;
    ~^[45] 1;
}
# Do not include request, URI, headers or upstream URL: they may contain tokens.
log_format ws_diagnostic 'websocket status=$status upstream_status=$upstream_status '
                         'upstream=$upstream_addr connect=$upstream_connect_time '
                         'response=$upstream_response_time total=$request_time';

upstream backend_pool {
    zone backend_pool 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend-1:8080 resolve max_fails=1 fail_timeout=5s;
    server backend-2:8080 resolve max_fails=1 fail_timeout=5s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Allow a 5 MiB post image plus multipart fields and headers.
    client_max_body_size 6m;
    access_log /var/log/nginx/access.log without_query;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api(?:/|$) {
        proxy_pass http://backend_pool;
        # A stopped container can silently drop SYNs; do not wait 60s to fail over.
        proxy_connect_timeout 2s;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location ~ ^/ws(?:/|$) {
        proxy_pass http://backend_pool;
        proxy_connect_timeout 2s;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # Nginx error messages can include the full request (with its token).
        # Replace raw errors with sanitized failure diagnostics on stderr.
        error_log /dev/null;
        access_log /var/log/nginx/access.log without_query;
        access_log /dev/stderr ws_diagnostic if=$ws_failed;
    }

    location /media/ {
        # Keep /media: it is the S3 bucket, followed by the object key.
        proxy_pass http://minio:9000;
        limit_except GET HEAD { deny all; }
    }
}
