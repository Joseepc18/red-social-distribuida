services:
  neo4j:
    image: neo4j:5-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Completa NEO4J_PASSWORD en .env}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - social
    healthcheck:
      test:
        - CMD-SHELL
        - cypher-shell -a bolt://localhost:7687 -u neo4j -p "$${NEO4J_AUTH#*/}" 'RETURN 1;' > /dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  minio:
    build:
      context: ./infra/minio
      target: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Completa MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Completa MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - social
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  minio-init:
    build:
      context: ./infra/minio
      target: mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Completa MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Completa MINIO_ROOT_PASSWORD en .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set storage http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing storage/media
        mc anonymous set download storage/media
        mc anonymous get storage/media
    networks:
      - social

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # Override the image's /data volume with memory-only storage.
    tmpfs:
      - /data
    networks:
      - social
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(redis-cli ping)\" = PONG ]"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  social:
    driver: bridge

volumes:
  neo4j_data:
  minio_data:
