map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Omit query strings and Referer: both may contain a WebSocket JWT.
log_format without_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log without_query;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ ^/api(?:/|$) {
        proxy_pass http://backend-1:8080;
    }

    location ~ ^/ws(?:/|$) {
        proxy_pass http://backend-1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        # Nginx error messages can include the full request (with its token).
        # Keep status and timing in the sanitized access log instead.
        error_log /dev/null;
    }

    location /media/ {
        # Keep /media: it is the S3 bucket, followed by the object key.
        proxy_pass http://minio:9000;
        limit_except GET HEAD { deny all; }
    }
}
